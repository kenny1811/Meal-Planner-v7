<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Meal Planner — Mobile</title>
  <style>
    :root {
      --bg: #eef1f5; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
      --line: #d7dde5; --accent: #2563eb; --accent-soft: #e8effc;
      --good: #166534; --bad: #b91c1c; --bad-soft: #fde8e8;
      --work: #1d4ed8; --nonwork: #b45309;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang HK", sans-serif; }
    .app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--bg);
      display: flex; flex-direction: column; }
    /* top date bar */
    .topbar { position: sticky; top: 0; z-index: 5; background: var(--card);
      border-bottom: 1px solid var(--line); padding: 10px 12px;
      display: flex; align-items: center; gap: 8px; }
    .navbtn { flex: 0 0 auto; width: 40px; height: 40px; border: 1px solid var(--line);
      background: #fff; border-radius: 10px; font-size: 20px; color: var(--accent);
      cursor: pointer; line-height: 1; }
    .navbtn:active { background: var(--accent-soft); }
    .dateblock { flex: 1 1 auto; text-align: center; }
    .dateblock .d { font-size: 18px; font-weight: 700; }
    .dateblock .sub { font-size: 12px; color: var(--muted); margin-top: 2px;
      display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
    .badge.work { color: #fff; background: var(--work); }
    .badge.nonwork { color: #fff; background: var(--nonwork); }
    .badge.code { color: var(--ink); background: #eef2f7; border: 1px solid var(--line); }
    input[type=date] { position: absolute; opacity: 0; width: 0; height: 0; }
    .datetap { cursor: pointer; }
    /* body */
    .content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .meal-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--line); background: #fbfcfe; }
    .meal-name { font-weight: 700; font-size: 15px; }
    .meal-time { margin-left: auto; font-size: 13px; color: var(--muted);
      font-variant-numeric: tabular-nums; }
    .meal-items { padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 4px; }
    .item { font-size: 14px; line-height: 1.5; }
    .item .g { color: var(--muted); font-size: 13px; }
    .restaurant { font-size: 14px; color: var(--accent); font-weight: 600; }
    .ricenote { font-size: 12px; color: var(--muted); white-space: pre-line;
      padding: 2px 2px 0; }
    /* nutrient summary */
    .nutwrap { padding: 4px 6px 8px; }
    .nutrow { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 4px;
      padding: 7px 8px; border-bottom: 1px solid #eef1f5; align-items: center; }
    .nutrow:last-child { border-bottom: 0; }
    .nutrow.head { font-size: 11px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--line); }
    .nutrow .lbl { font-size: 13px; }
    .nutrow .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
    .nutrow .tgt { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
    .nutrow.red { background: var(--bad-soft); border-radius: 8px; }
    .nutrow.red .val { color: var(--bad); }
    .section-title { font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px; }
    .state { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }
    .err { color: var(--bad); }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button class="navbtn" id="prev" title="前一日">‹</button>
      <div class="dateblock datetap" id="datetap">
        <div class="d" id="d-date">—</div>
        <div class="sub" id="d-sub"></div>
        <input type="date" id="datepick" />
      </div>
      <button class="navbtn" id="next" title="下一日">›</button>
    </div>
    <div class="content" id="content">
      <div class="state">Loading…</div>
    </div>
  </div>

  <script>
    const NUT_LABELS = ["卡路里 kCal","蛋白質 g","碳水 g","天然糖 g","膽固醇 mg","鈉 mg","鈣 mg","總脂肪 g","飽和脂肪 g","反式脂肪 g"];
    const DOW = ["日","一","二","三","四","五","六"];
    const MEAL_ORDER = ["早餐","午餐","小食","晚餐"];

    function pad(n){ return String(n).padStart(2,"0"); }
    function todayHK(){
      const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Hong_Kong",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
      const g = t => p.find(x=>x.type===t).value;
      return `${g("year")}-${g("month")}-${g("day")}`;
    }
    function addDays(iso, n){
      const [y,m,d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m-1, d + n, 12));
      return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`;
    }
    function fmtDate(iso){
      const [y,m,d] = iso.split("-").map(Number);
      return `${d}/${m}/${y}`;
    }
    function dowZh(iso){
      const [y,m,d] = iso.split("-").map(Number);
      return "星期" + DOW[new Date(Date.UTC(y,m-1,d,12)).getUTCDay()];
    }
    function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
    function splitGram(s){
      const m = String(s).match(/^(.*?)\((\d+g)\)\s*$/);
      if (m) return `${esc(m[1])}<span class="g">(${esc(m[2])})</span>`;
      return esc(s);
    }

    let cur = todayHK();

    async function load(){
      const content = document.getElementById("content");
      document.getElementById("d-date").textContent = fmtDate(cur);
      document.getElementById("datepick").value = cur;
      content.innerHTML = '<div class="state">Loading…</div>';
      let data;
      try {
        const r = await fetch(`/api/mobile-meal-plan?date_iso=${cur}`);
        data = await r.json();
      } catch (e) {
        content.innerHTML = '<div class="state err">連線失敗</div>'; return;
      }
      renderSub(data);
      if (!data.ok || !data.day){
        content.innerHTML = `<div class="state">${esc(data.message || "呢日未生成餐單")}</div>`;
        return;
      }
      content.innerHTML = renderDay(data);
    }

    function renderSub(data){
      const sub = document.getElementById("d-sub");
      const day = data.day || {};
      const wk = dowZh(cur);
      const code = day.roster_code ? `<span class="badge code">${esc(day.roster_code)}</span>` : "";
      let workBadge = "";
      if (day.is_work_day === true) workBadge = '<span class="badge work">返工</span>';
      else if (day.is_work_day === false) workBadge = '<span class="badge nonwork">休息</span>';
      sub.innerHTML = `<span>${wk}</span>${code}${workBadge}`;
    }

    function renderDay(data){
      const day = data.day, mp = day.meal_plan || {};
      const ingredients = mp.meal_ingredients || {};
      const times = mp.meal_times_resolved || {};
      let html = "";

      // meals
      const meals = MEAL_ORDER.filter(m => Array.isArray(ingredients[m]) && ingredients[m].length);
      for (const m of meals){
        const items = ingredients[m];
        const t = times[m] ? `<span class="meal-time">${esc(times[m])}</span>` : "";
        let body = "";
        for (const it of items){
          const isRestaurant = /—|Lunch|Dinner|Breakfast/.test(it) && /\(.*\)/.test(it) && !/\d+g\)/.test(it);
          if (isRestaurant) body += `<div class="restaurant">${esc(it)}</div>`;
          else body += `<div class="item">${splitGram(it)}</div>`;
        }
        html += `<div class="card"><div class="meal-head"><span class="meal-name">${esc(m)}</span>${t}</div><div class="meal-items">${body}</div></div>`;
      }

      if (mp.rice_note){
        html += `<div class="ricenote">${esc(mp.rice_note)}</div>`;
      }

      // nutrients
      const summary = mp.summary || {};
      const totals = Array.isArray(summary.totals) ? summary.totals : [];
      const reds = Array.isArray(summary.total_red_flags) ? summary.total_red_flags : [];
      const keys = data.nutrient_keys || [];
      const inds = day.nutrient_indicators || {};
      let rows = `<div class="nutrow head"><span class="lbl">營養</span><span class="val">全日</span><span class="tgt">目標</span></div>`;
      for (let i=0;i<keys.length;i++){
        const label = NUT_LABELS[i] || keys[i];
        const val = totals[i]!=null ? (Math.round(totals[i]*10)/10) : "—";
        const ind = inds[keys[i]] || {};
        const tgt = ind.raw || "";
        const red = reds[i] ? " red" : "";
        rows += `<div class="nutrow${red}"><span class="lbl">${esc(label)}</span><span class="val">${val}</span><span class="tgt">${esc(tgt)}</span></div>`;
      }
      html += `<div class="section-title">全日營養</div><div class="card nutwrap">${rows}</div>`;

      return html;
    }

    document.getElementById("prev").addEventListener("click", () => { cur = addDays(cur,-1); load(); });
    document.getElementById("next").addEventListener("click", () => { cur = addDays(cur,1); load(); });
    document.getElementById("datetap").addEventListener("click", () => document.getElementById("datepick").showPicker ? document.getElementById("datepick").showPicker() : document.getElementById("datepick").click());
    document.getElementById("datepick").addEventListener("change", (e) => { if(e.target.value){ cur = e.target.value; load(); } });

    load();
  </script>
</body>
</html>
