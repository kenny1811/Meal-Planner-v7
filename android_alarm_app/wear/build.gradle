plugins {
    id "com.android.application"
}

android {
    namespace "com.example.oneshotalarm.watch"
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.oneshotalarm"
        minSdk 26
        targetSdk 35
        // 版本只改 versionName 一行；versionCode 自動 = major*100 + minor（7.0 → 700），updater 靠佢比較
        versionName "7.4"
        versionCode versionName.tokenize('.')[0].toInteger() * 100 + versionName.tokenize('.')[1].toInteger()
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "com.google.guava:guava:33.2.1-android"
}
