# 餐單生成 — 預設組態（§2：禁止在程式內寫死；此檔為預設來源）
# 可用環境變數覆寫：MENU_DATABASE、MENU_CONFIG、MENU_PROJECT_ROOT

database:
  # 全部資料（維護表、營養清單、targets）嘅唯一來源；可由 MENU_DATABASE 指定絕對路徑
  filename: "meal_planner.sqlite3"

folders:
  # system_folder 為 v7 程式根目錄；data_folder 可放 sqlite / plans_store。
  system_folder: 'D:\Projects\餐單生成v7'
  data_folder: 'D:\Projects\餐單生成v7'

# 維護表喺 Config 頁嘅來源名（純顯示用）
sheets:
  roster: "更表"
  meal_times: "飯時"
  restaurant: "餐廳選擇"
  overtime: "加班表"
  schedule_grid: "行位表"
  payroll_times: "更時表"
  public_holidays: "公眾假期"

nutrition_format:
  tolerance: 5
  kcal_per_fat_g: 9

nutrition_portion:
  default_g: 100

rice:
  # 熟重→生重換算：由上至下第一個「名稱包含 name_contains」嘅行命中就用該 ratio；
  # 冇命中冇 fallback——米類備註／購物清單會直接寫明未設定，提醒去 Config 加行。
  cooked_to_raw:
    - { name_contains: "糙米", ratio: 2.6363 }
    - { name_contains: "三色藜麥米", ratio: 2.6788 }
    - { name_contains: "藜麥米", ratio: 2.6282 }
  water_multiplier: 2
  rice_category_exact: "米"
  # 米類備註：食材名稱包含以下字串即計入熟重。
  note_name_contains: ["米"]

dates:
  timezone: "Asia/Hong_Kong"

pattern:
  item_separator: "+"
  item_alt_separator: "/"

# 業務規則：把原本散落在程式內的餐單行為集中在此。
meal_business_rules:
  # 固定餐不交由 solver 調整，只按候選輪替揀食材並把營養扣入全日總數。
  fixed_meals: ["小食"]
  # 餐廳午餐只在返工日套用；命中後午餐由餐廳固定營養提供。
  restaurant_lunch_workday_only: true

# LP 次目標：貼近 Hi 之帶寬（與 §4 對應；優化器實作時讀取）
optimizer:
  band_delta_default: 50
  # 快速生成：以下三項會增加多輪 solver 次數；需要深入診斷時先手動打開。
  replacement_search_enabled: false
  auto_retry_enabled: false
  relaxation_simulation_enabled: false
  # 中點回拉：每克偏離候選 (Min+Max)/2 之軟性成本，防止低營養密度食材（如菜）
  # 在無實際需要時被谷到 Max。實測 0.1–0.2 可把菜由 Max 拉回中點且不觸發任何
  # 營養紅旗；≥0.5 會開始扭曲蛋白／油／種籽份量。0 = 停用。
  midpoint_pull_weight: 0.15
  # 米類跨餐平均分配：每克餐間差異之軟成本。營養目標係全日總量，米點分餐都
  # 唔影響達標，所以呢個近乎零代價就令米平均落各餐（實測 255/135 → 195/195，
  # 總量不變、零紅旗）。0 = 停用。
  rice_balance_weight: 1.0
  # 每餐蛋白下限（長者防肌少症，每餐 ~25-30g 先有效刺激肌肉合成）。軟性 floor，
  # 只套用喺 LP 優化嘅屋企餐；同鈣等硬約束衝突時鈣優先。實測 floor=28 對 7 月
  # 各日零紅旗、鈣不爆，把臨界晚餐托上門檻。0 = 停用。
  meal_protein_floor_g: 28.0
  meal_protein_floor_weight: 2.0
  # 每餐蛋白平均分配：每克餐間差異之軟成本。上面個 floor 只托底唔削峰，呢個先至
  # 會把高蛋白嘅餐拉低、低嘅拉高。實測 18-31/8 零紅旗，餐間落差 23.2g → 2.9g，
  # 每日最低嗰餐由 23.3g 升到 31.6g。注意唔好畀細數：0.5-2 嗰帶 solver 淨係識削
  # 早餐蛋白粉，全日蛋白反而由 102.6g 跌到 92.9g；≥5 先值得換食材（豆腐→魚），
  # 總量返返嚟。副作用：卡路里平均低 ~40/日，非返工日多數貼實下限。0 = 停用。
  protein_balance_weight: 10.0
  # 「貼近 Hi」次目標入面卡路里嗰條嘅權重（每 kcal 距離 Hi 之成本；其他營養素
  # 固定 0.05）。蛋白平均化每克罰 10 分，會蓋過原本 0.05 嘅弱拉力，令全日熱量
  # 長期貼住下限，所以要加重返。實測 1.0 最啱：卡路里同全日蛋白都返到原本水平，
  # 餐間落差幾乎冇損失；≥2 會開始為咗谷熱量而犧牲平均，≥3 更加日日餐單一樣。
  kcal_hi_pull_weight: 1.0
  weights:
    kcal: 1.0
    protein: 1.0
    carb: 15.0
    sugar: 0.5
    cholesterol: 0.5
    sodium: 0.5
    calcium: 1.0
  # 無法全部達標時，優先避免脂肪超標；鈣可以高過下限。
  fat_cap_weights:
    total: 50.0
    saturated: 10.0
    trans: 10.0
